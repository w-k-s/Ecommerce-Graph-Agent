[project]
name = "olist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Waqqas Sheikh", email = "waqqas.abdulkareem@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "db-dtypes>=1.9.0",
    "dotenv>=0.9.9",
    "google-cloud-bigquery>=3.46.2",
    "google-cloud-storage>=3.17.1",
    "google-genai>=2.33.0",
    "kaggle>=2.2.5",
    "langchain>=1.4.7",
    "langchain-google-vertexai>=3.2.4",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pyarrow>=23.0.1",
    "pydantic>=2.14.1",
    "tenacity>=9.1.4",
    "unidecode>=1.4.0",
]

[project.scripts]
olist = "olist:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
