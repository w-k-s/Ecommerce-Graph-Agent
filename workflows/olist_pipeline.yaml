main:
  steps:
    - init: 
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
    - build_silver:
        call: googleapis.bigquery.v2.jobs.insert
        args:
          projectId: ${project}
          body:
            configuration:
              query:
                query: "CALL pipeline.build_silver();"
                useLegacySql: false
    - build_gold:
        call: googleapis.bigquery.v2.jobs.insert
        args:
          projectId: ${project}
          body:
            configuration:
              query:
                query: "CALL pipeline.build_gold();"
                useLegacySql: false
    - run_checks:
        call: googleapis.bigquery.v2.jobs.insert
        args:
          projectId: ${project}
          body:
            configuration:
              query:
                query: "CALL pipeline.run_checks();"
                useLegacySql: false
    - done:
        return: "SUCCEEDED"